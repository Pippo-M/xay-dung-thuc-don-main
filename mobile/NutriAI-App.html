<style>
/* Layout: ứng dụng một màn hình, cột 520px, thanh tab dưới cố định trong khung */
:root{
  --bg:#F4F8F7; --surface:#FFFFFF; --surface2:#EEF4F2; --text:#14211E; --muted:#4E5E5A; --line:#D6E1DE;
  --primary:#00796B; --on-primary:#FFFFFF; --tint:#E0F2F1; --track:#DCE7E4;
  --ok:#2E7D32; --ok-bg:#E7F4E8; --warn:#7A4F00; --warn-bg:#FFF3D6; --warn-line:#F9A825; --bad:#B3261E; --bad-bg:#FDECEA;
  --scrim:rgba(10,20,18,.5); --P:#1565C0; --L:#E39B00; --C:#8D6E63;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1513; --surface:#17211E; --surface2:#1F2B28; --text:#E4EEEB; --muted:#A2B4AF; --line:#2D3C38;
  --primary:#4DB6AC; --on-primary:#00201C; --tint:#12332E; --track:#2A3A36;
  --ok:#81C784; --ok-bg:#16301A; --warn:#FFD54F; --warn-bg:#33290F; --warn-line:#F9A825; --bad:#F28B82; --bad-bg:#3A1B19;
  --scrim:rgba(0,0,0,.6); --P:#64B5F6; --L:#FFCA28; --C:#BCAAA4; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1513; --surface:#17211E; --surface2:#1F2B28; --text:#E4EEEB; --muted:#A2B4AF; --line:#2D3C38;
  --primary:#4DB6AC; --on-primary:#00201C; --tint:#12332E; --track:#2A3A36;
  --ok:#81C784; --ok-bg:#16301A; --warn:#FFD54F; --warn-bg:#33290F; --warn-line:#F9A825; --bad:#F28B82; --bad-bg:#3A1B19;
  --scrim:rgba(0,0,0,.6); --P:#64B5F6; --L:#FFCA28; --C:#BCAAA4; color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.h1{font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.h2{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.s{font-size:14px}.xs{font-size:13px}
.b{font-weight:700}.xb{font-weight:800}
.num{font-variant-numeric:tabular-nums}
.center{text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.tile{background:var(--surface2);border-radius:14px;padding:10px 12px}
.btn{min-height:48px;border-radius:14px;border:0;font-weight:700;font-size:15px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-p{background:var(--primary);color:var(--on-primary)}
.btn-s{background:var(--surface2);color:var(--text);border:1px solid var(--line)}
.btn-o{background:transparent;color:var(--primary);border:1.5px solid var(--primary)}
.btn-t{background:transparent;color:var(--primary)}
.btn-x{min-height:56px;font-size:17px;border-radius:16px}
.btn[disabled]{background:var(--track);color:var(--muted);border:0;cursor:not-allowed}
.block{width:100%}
.chip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap;display:inline-block}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}.c-bad{background:var(--bad-bg);color:var(--bad)}.c-tint{background:var(--tint);color:var(--primary)}.c-mute{background:var(--surface2);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex-shrink:0}
.bar{height:10px;border-radius:999px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.ring{width:148px;height:148px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring>div{width:116px;height:116px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.input{height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.input.err{border-color:var(--bad)}
.opt{min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-size:15px;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.opt[aria-pressed="true"],.opt[aria-checked="true"]{border-color:var(--primary);background:var(--tint);color:var(--primary)}
.optcard{min-height:72px;text-align:left;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:14px;width:100%}
.optcard[aria-checked="true"]{border-color:var(--primary);background:var(--tint)}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.optcard[aria-checked="true"] .radio{border-color:var(--primary)}
.optcard[aria-checked="true"] .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--primary)}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:56px;height:56px;border-radius:16px;border:0;background:var(--surface2);color:var(--primary);font-size:28px;font-weight:700}
.bignum{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.progress{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--primary);border-radius:999px;transition:width .25s}
.itemrow{width:100%;display:flex;align-items:center;gap:12px;padding:10px 0;min-height:56px;background:none;border:0;border-top:1px solid var(--line);text-align:left}
.switch{width:52px;height:32px;border-radius:999px;background:var(--track);position:relative;flex-shrink:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
[aria-checked="true"]>.switch{background:var(--primary)}
[aria-checked="true"]>.switch::after{left:24px}
.listbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;background:none;border:0;border-top:1px solid var(--line);padding:0;text-align:left}
.nav{flex-shrink:0;background:var(--surface);border-top:1px solid var(--line)}
.nav-in{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:start;height:76px;padding-top:6px;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.navbtn{background:none;border:0;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:13px;font-weight:500}
.navbtn[aria-current="page"]{color:var(--primary);font-weight:700}
.fab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:-28px;color:var(--muted);font-size:12px;font-weight:700;white-space:nowrap}
.fab>span:first-child{width:62px;height:62px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;border:4px solid var(--surface);box-shadow:0 6px 16px rgba(0,121,107,.35)}
.fab[aria-current="page"]{color:var(--primary)}
.sheet-wrap{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-end;z-index:20}
.sheet-bg{position:absolute;inset:0;background:transparent;border:0}
.sheet{position:relative;width:100%;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.handle{align-self:center;width:40px;height:5px;border-radius:999px;background:var(--line)}
.alert{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.alert-red{border:2px solid var(--bad);background:var(--bad-bg)}
.alert-amber{border:2px solid var(--warn-line);background:var(--warn-bg)}
.alt{background:var(--surface);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px}
.bu{align-self:flex-end;max-width:82%;background:var(--primary);color:var(--on-primary);padding:10px 14px;border-radius:18px 18px 4px 18px;white-space:pre-line;overflow-wrap:anywhere}
.bb{align-self:flex-start;max-width:88%;background:var(--surface);border:1px solid var(--line);padding:10px 14px;border-radius:18px 18px 18px 4px;white-space:pre-line}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.qchip{flex-shrink:0;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--primary);background:var(--surface);color:var(--primary);font-size:14px;font-weight:600}
.days{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.days::-webkit-scrollbar{display:none}
.daybtn{flex-shrink:0;width:58px;min-height:64px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.daybtn[aria-selected="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal span{height:40px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:15px;border:2px solid transparent}
.overlay{position:absolute;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px 24px}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:40;background:var(--text);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.trend{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--line);padding-top:8px;position:relative}
.trend>div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.trend i{display:block;width:100%;border-radius:6px 6px 0 0;background:var(--primary)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

function altsFor(id, g){
  var f = FOODS[id];
  if (!f.grp || f.gi === 0 || f.c < 5) return { better:[], worse:0 };
  var cur = calc(id, g);
  var all = Object.keys(FOODS).filter(function(k){ return k !== id && FOODS[k].grp === f.grp; }).map(function(k){
    var ng = Math.max(5, Math.round(cur.kcal / (FOODS[k].kcal / 100) / 5) * 5);

  }).sort(function(a, b){ return a.v.gl - b.v.gl; });

      messages:[ { role:'user', content:'Bệnh nền: ' + ds + '.\nCâu hỏi của người bệnh: ' + q + '\nCâu trả lời cần kiểm tra:\n' + ans + '\n\nNếu câu trả lời khuyên dùng thực phẩm có hại cho bệnh nền trên (kể cả đường ẩn trong món chế biến), trả về một câu cảnh báo dưới 30 từ. Nếu an toàn, chỉ trả về SAFE.' } ] })
    .then(function(d){
      var v = cleanAI((d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '');
      if (!v || /^\W*safe\b/i.test(v)) return;

      save(); U.toBottom = true; render();
    })
    .catch(function(){});
}

function ctx(){

  var menu = S.menus[TODAY], done = S.done[TODAY] || {};
  var mt = {}, eaten = { kcal:0, p:0, l:0, c:0, gl:0 }, day = dayTot(menu), top = null;
  MEALS.forEach(function(m){
    mt[m.k] = tot(menu[m.k]);
    if (done[m.k]) for (var k in eaten) eaten[k] += mt[m.k][k];
    menu[m.k].forEach(function(it, i){ var v = calc(it.id, it.g); if (!top || v.gl > top.v.gl) top = { mk:m.k, i:i, it:it, v:v, meal:m }; });
  });
  for (var k in eaten) eaten[k] = r1(eaten[k]);
  var allDone = MEALS.every(function(m){ return done[m.k]; });
  return { p:p, t:t, menu:menu, done:done, mt:mt, eaten:eaten, day:day, top:top, allDone:allDone,
    remaining:r1(t.tdee - eaten.kcal), gapDay:r1(Math.abs(day.kcal - t.tdee)), gapEaten:r1(Math.abs(eaten.kcal - t.tdee)), key:key };
}
function glChip(v){ var c = glCls(v.gl, v.gi); return '<span class="chip c-' + c + '">' + (v.gi === 0 ? 'GL ≈ 0' : 'GL ' + nf(v.gl)) + '</span>'; }

    '<section class="card" aria-label="Năng lượng hôm nay" style="padding:20px"><div class="row" style="gap:18px">' +
      '<div class="ring" role="img" aria-label="Đã ăn ' + nf(c.eaten.kcal) + ' trên mục tiêu ' + nf(t.tdee, 0) + ' kcal" style="background:conic-gradient(' + ring.color + ' ' + pct + 'deg, var(--track) 0deg)"><div><span class="xs muted">' + ring.top + '</span><span class="num xb" style="font-size:30px;line-height:1.1">' + ring.big + '</span><span class="xs muted">kcal</span></div></div>' +
      '<div class="grow stack-s s" style="gap:8px"><div class="row between"><span class="muted">Mục tiêu</span><b class="num">' + nf(t.tdee, 0) + '</b></div><div class="row between"><span class="muted">Đã ăn</span><b class="num">' + nf(c.eaten.kcal) + '</b></div><div class="row between"><span class="muted">Dự kiến ngày</span><b class="num">' + nf(c.day.kcal) + '</b></div><span class="chip ' + ring.cls + '" style="align-self:flex-start">' + ring.status + '</span></div></div>' +
      '<div class="stack-s" style="margin-top:18px">' + macro.map(function(m){ var e = c.eaten[m[1]]; return '<div><div class="row between s" style="margin-bottom:6px"><span class="row b" style="gap:8px"><i class="dot" style="background:' + m[3] + '"></i>' + m[0] + '</span><span class="num muted"><b style="color:var(--text)">' + nf(e) + '</b> / ' + m[2] + ' g</span></div><div class="bar"><i style="width:' + Math.min(100, Math.round(e / m[2] * 100)) + '%;background:' + m[3] + '"></i></div></div>'; }).join('') + '</div>' +

function vMenu(c){

    '<div class="grid4">' + [ [ 'Đạm', d.p + '', c.t.P, 'var(--P)' ], [ 'Béo', d.l + '', c.t.L, 'var(--L)' ], [ 'Bột', d.c + '', c.t.C, 'var(--C)' ] ].map(function(x){ return '<div class="tile" style="padding:8px 10px"><div class="xs muted row" style="gap:5px"><i class="dot" style="width:8px;height:8px;background:' + x[3] + '"></i>' + x[0] + '</div><div class="num xb" style="font-size:15px;white-space:nowrap">' + nf(+x[1]) + ' g</div><div class="xs muted">/ ' + x[2] + ' g</div></div>'; }).join('') +

      menu[m.k].map(function(it, i){ var v = calc(it.id, it.g); return '<button class="itemrow" data-a="open-food" data-mk="' + m.k + '" data-i="' + i + '"><span class="grow" style="display:flex;flex-direction:column"><span class="b" style="font-weight:600">' + FOODS[it.id].n + '</span><span class="s muted num">' + nf(it.g, 0) + ' g · ' + nf(v.kcal) + ' kcal</span>' + (it.from ? '<span class="xs b" style="color:var(--primary)">Đã thay vì: ' + esc(it.from) + '</span>' : '') + '</span>' + glChip(v) + '<span class="muted">' + ic('chev', 18) + '</span></button>'; }).join('') + '</section>';

function vLog(c){
  var now = new Date(), y = now.getFullYear(), mo = now.getMonth();
  var first = new Date(y, mo, 1), lead = (first.getDay() + 6) % 7, nDays = new Date(y, mo + 1, 0).getDate();
  var stat = function(key){
    var menu = S.menus[key], done = S.done[key];

    c.menu[m.k].map(function(it){ return '<div class="row between s muted" style="padding-top:4px"><span>' + FOODS[it.id].n + ' · ' + nf(it.g, 0) + ' g' + (it.from ? ' <span class="b" style="color:var(--primary)">(thay ' + esc(it.from) + ')</span>' : '') + '</span><span class="num">' + nf(calc(it.id, it.g).kcal) + '</span></div>'; }).join('') + '</div>'; }).join('');

function currentView(){
  if (!S.account) return 'login';
  if (U.view === 'onb') return 'onb';
  if (U.view === 'emr' || !S.profile) return 'emr';
  return 'app';
}
function render(){
  var sc = document.getElementById('sc'), top = sc ? sc.scrollTop : 0;
  var t = document.getElementById('toast');
  var v = currentView();
  app.innerHTML = v === 'login' ? vLogin() : v === 'emr' ? vEmr() : v === 'onb' ? vOnb() : vApp();
  if (t) app.appendChild(t);
  var ns = document.getElementById('sc');
  if (ns) {
    if (U.toBottom) { ns.scrollTop = ns.scrollHeight; U.toBottom = false; }
    else if (U.resetScroll) { ns.scrollTop = 0; U.resetScroll = false; }
    else ns.scrollTop = top;
  }
}

/* ---------- Chat ---------- */
function reply(q, chipId){
  var p = S.profile, out = [ { k:'user', text:q } ], low = q.toLowerCase();
  var hits = layer1(q, p);
  hits.forEach(function(h){
    var a = ALT[h.disease];
    if (h.disease === 'Tiểu đường' && h.kws.indexOf('nước ngọt') >= 0) a = { t:'Trà xanh không đường', i:'Thay nước ngọt, không làm tăng đường huyết' };
    out.push({ k:'block', title:h.kws.map(function(k){ return k.charAt(0).toUpperCase() + k.slice(1); }).join(', ') + ' không phù hợp với bệnh ' + DLABEL[h.disease] + ' của bạn', reason:REASON[h.disease], layer:'Chặn bởi Lớp 1 · Luật y khoa', alt:a.t, altInfo:a.i, used:false });
  });
  var dtd = !!p.dis.dtd, handled = hits.length > 0;
  if (dtd && /(^|[^\p{L}])xôi(?![\p{L}])|gạo nếp/u.test(low)) {
    var a1 = calc('gao_nep', 200), b1 = calc('gao_lut', 200);
    out.push({ k:'swap', title:'Xôi nếp có GI cao (86) — đề xuất đổi', fromName:'Xôi · 200 g gạo nếp', fromInfo:nf(a1.kcal) + ' kcal · GL ' + nf(a1.gl), toName:'Cơm gạo lứt · 200 g', toInfo:nf(b1.kcal) + ' kcal · GL ' + nf(b1.gl), delta:'Giảm ' + nf((a1.gl - b1.gl) / a1.gl * 100) + '% GL, năng lượng gần như giữ nguyên', note:'Gạo lứt vẫn thuộc mức GL cao — nên giảm khẩu phần và ăn kèm rau, đạm.' });
    handled = true;
  }
  if (!ONLINE && dtd && /(^|[^\p{L}])kho(?![\p{L}])/u.test(low)) {
    out.push({ k:'block', title:'Món kho nên hạn chế với bệnh Tiểu đường', reason:'Món kho thường dùng nước màu (đường thắng) hoặc nước dừa — đường ẩn mà danh sách từ khóa không phát hiện được.', layer:'Lớp 2 · AI kiểm duyệt (mô phỏng trong bản thử)', alt:'Thịt lợn nạc luộc 100 g', altInfo:'139,0 kcal · Bột đường 0 g · GL ≈ 0', used:false });
    handled = true;
  }
  var c = ctx(), localOnly = false;
  if (/calo|ngân sách|kcal/.test(low) && !hits.length) {
    localOnly = true;
    var next = MEALS.filter(function(m){ return !c.done[m.k]; });
    out.push({ k:'bot', text: next.length
      ? 'Bạn đã ăn ' + nf(c.eaten.kcal) + ' kcal hôm nay.\nNgân sách còn lại: ' + nf(Math.max(c.remaining, 0)) + ' kcal cho ' + next.map(function(m){ return m.t.toLowerCase(); }).join(', ') + '.\nNếu ăn theo gợi ý, cả ngày lệch ' + nf(c.gapDay) + ' kcal' + (c.gapDay < 50 ? ' — trong ngưỡng ±50 kcal.' : ' — ngoài ngưỡng ±50 kcal.')
      : 'Bạn đã ăn đủ 3 bữa: ' + nf(c.eaten.kcal) + ' kcal, lệch ' + nf(c.gapEaten) + ' kcal so với mục tiêu ' + nf(c.t.tdee, 0) + ' kcal.' });
    handled = true;
  }
  if (/thay cơm|thay gạo|cơm trắng/.test(low)) {
    localOnly = true;
    var base = calc('gao_te', 100), al = altsFor('gao_te', 100).better;
    out.push({ k:'bot', text:'Cùng năng lượng với 100 g gạo tẻ (' + nf(base.kcal) + ' kcal · GL ' + nf(base.gl) + '):\n' + al.map(function(a){ return '• ' + FOODS[a.id].n + ' ' + nf(a.g, 0) + ' g — GL ' + nf(a.v.gl) + ' (giảm ' + nf(Math.abs(a.delta)) + '%)'; }).join('\n') + '\nMiến dong giảm GL nhiều nhất; các lựa chọn khác giảm ít.' });
    handled = true;
  }
  if (!handled && !ONLINE) out.push({ k:'bot', text:'Lớp 1 không phát hiện thực phẩm chống chỉ định với hồ sơ của bạn' + (diseaseNames(p) ? ' (' + diseaseNames(p) + ')' : '') + '.\nBản thử nghiệm chưa nối với máy chủ AI nên chưa trả lời tự do. Bản chính thức gửi câu hỏi tới GPT-OSS-120B kèm hồ sơ và danh sách 621 món, rồi kiểm tra thêm bằng Lớp 2.' });
  var useAI = !!ONLINE && !localOnly;
  if (useAI) out.push({ k:'typing' });
  S.chat = S.chat.concat(out).slice(-60);
  if (chipId) U.chips[chipId] = true;
  save(); U.toBottom = true; render();
  if (useAI) askAI(q);
}

/* ---------- Hành động ---------- */
var genT;
function runGen(){
  if (U.gen !== null) return;
  U.gen = 0; render();
  var tick = function(){
    U.gen++;
    if (U.gen < GEN_STEPS.length) { render(); genT = setTimeout(tick, 700); return; }
    var key = dkey(addDays(new Date(), U.day));
    S.menus[key] = genMenu(S.profile, U.day);
    if (!S.done[key]) S.done[key] = {};
    save(); U.gen = null; U.tab = 'menu'; render();
    var hits = 0;
    MEALS.forEach(function(m){ S.menus[key][m.k].forEach(function(it){ hits += layer1(FOODS[it.id].n, S.profile).length; }); });
    toast('Đã tạo thực đơn · ' + hits + ' món vi phạm sau kiểm tra Lớp 1');
  };
  genT = setTimeout(tick, 700);
}
function act(a, ds){
  var d = U.draft, menuKey;
  switch (a) {
    case 'google': if (ONLINE) { googleLogin(); return; } S.account = { method:'google', label:'Tài khoản Google (mô phỏng trong bản thử)', initial:'G' }; save(); U.resetScroll = true; break;
    case 'auth-mode':
      var cur = document.getElementById(U.authMode === 'register' ? 'rg-email' : 'lg-email');
      U.form = { email: cur ? cur.value.trim() : '', name: (document.getElementById('rg-name') || {}).value || '' };
      U.authMode = ds.k; U.loginErr = ''; break;
    case 'logout':
      if (ONLINE) { try { if (window.firebase && firebase.apps.length) firebase.auth().signOut(); } catch (e) {} S = freshState(); U.srv = null; U.chips = {}; }
      else S.account = null;
      U.view = null; U.tab = 'today'; save(); break;
    case 'to-emr': U.view = 'emr'; U.resetScroll = true; break;
    case 'emr-back': U.view = null; break;
    case 'emr-toggle': U.emrOn[ds.k] = !U.emrOn[ds.k]; break;
    case 'to-onb': case 'edit-profile': U.draft = S.profile ? clone(S.profile) : defaultDraft(); U.step = 0; U.showCalc = false; U.view = 'onb'; U.resetScroll = true; break;
    case 'onb-back': if (U.step > 0) U.step--; else U.view = S.profile ? null : 'emr'; U.resetScroll = true; break;
    case 'onb-next': U.step = Math.min(5, U.step + 1); U.resetScroll = true; break;
    case 'onb-restart': U.step = 0; U.showCalc = false; U.resetScroll = true; break;
    case 'onb-gender': d.gender = ds.k; break;
    case 'onb-age': d.age = Math.max(18, Math.min(90, d.age + +ds.d)); break;
    case 'onb-h': d.h = Math.max(120, Math.min(220, d.h + +ds.d)); break;
    case 'onb-w': d.w = Math.max(30, Math.min(200, d.w + +ds.d)); break;
    case 'onb-pal': d.pal = +ds.v; break;
    case 'onb-dis': if (ds.k === 'none') d.dis = d.dis.none ? {} : { none:true }; else { d.dis[ds.k] = !d.dis[ds.k]; delete d.dis.none; } break;
    case 'onb-avoid': d.avoid[ds.k] = !d.avoid[ds.k]; break;
    case 'onb-like': d.likes[ds.k] = !d.likes[ds.k]; break;
    case 'onb-calc': U.showCalc = !U.showCalc; break;
    case 'onb-save':
      var changed = !S.profile || JSON.stringify(S.profile) !== JSON.stringify(d);
      S.profile = clone(d);
      if (changed) { S.menus = {}; S.menus[TODAY] = genMenu(S.profile, 0); S.done[TODAY] = S.done[TODAY] || {}; S.chat = []; U.chips = {}; }
      save(); U.view = null; U.tab = 'today'; U.resetScroll = true; render(); toast('Đã lưu hồ sơ · mục tiêu ' + nf(targets(S.profile).tdee, 0) + ' kcal/ngày');
      if (ONLINE) pushProfile();
      return;
    case 'tab': U.tab = ds.k; U.sheet = null; U.resetScroll = true; if (ds.k === 'chat') U.toBottom = true; if (ds.k === 'menu') U.day = 0; break;
    case 'day': U.day = +ds.i; break;
    case 'gen': runGen(); return;
    case 'meal-done': S.done[TODAY][ds.k] = true; save(); render(); toast('Đã ghi ' + MEALS.filter(function(m){ return m.k === ds.k; })[0].t.toLowerCase() + ' vào nhật ký'); if (ONLINE) postMeal(ds.k); return;
    case 'meal-undo': delete S.done[TODAY][ds.k]; save(); if (ONLINE) { render(); toast('Đã hoàn tác trên máy này; bản ghi đã gửi máy chủ vẫn được giữ'); return; } break;
    case 'formula': U.sheet = 'formula'; break;
    case 'close': U.sheet = null; U.swapView = false; break;
    case 'open-food':
      menuKey = U.tab === 'menu' ? dkey(addDays(new Date(), U.day)) : TODAY;
      U.sel = { key:menuKey, mk:ds.mk, i:+ds.i }; U.draftG = S.menus[menuKey][ds.mk][+ds.i].g; U.swapView = ds.swap === '1'; U.sheet = 'food'; break;
    case 'g': U.draftG = Math.max(10, Math.min(1000, U.draftG + +ds.d)); break;
    case 'g-save': S.menus[U.sel.key][U.sel.mk][U.sel.i].g = U.draftG; save(); U.sheet = null; render(); toast('Đã cập nhật khối lượng — tổng ngày được tính lại'); return;
    case 'to-swap': U.swapView = true; break;
    case 'swap-back': U.swapView = false; break;
    case 'use-alt':
      var arr = S.menus[U.sel.key][U.sel.mk], old = arr[U.sel.i];
      arr[U.sel.i] = { id:ds.id, g:+ds.g, from: old.from || (FOODS[old.id].n + ' ' + nf(U.draftG, 0) + ' g') };
      save(); U.sheet = null; U.swapView = false; render(); toast('Đã đổi sang ' + FOODS[ds.id].n + ' ' + ds.g + ' g · GL giảm ' + ds.delta + '%'); return;
    case 'save-log':
      if (!ONLINE) { toast('Đã lưu. Bản chính thức ghi vào máy chủ qua POST /api/user/meals'); return; }
      menuKey = dkey(addDays(new Date(), U.day));
      api('/api/user/schedules', 'POST', { date:menuKey, meal_data:menuText(S.menus[menuKey]) })
        .then(function(){ toast('Đã lưu thực đơn — email nhắc bữa sẽ gửi thực đơn này'); })
        .catch(function(e){ toast('Chưa lưu được: ' + e.message); });
      return;
    case 'export':
      if (!ONLINE) { toast('Bản chính thức xuất Ho_So_Dinh_Duong_NutriAI.xlsx qua /api/export-excel'); return; }
      exportExcel(dkey(addDays(new Date(), U.day))); return;
    case 'share': toast('Bản thử nghiệm chưa hỗ trợ chia sẻ cho người thân'); return;
    case 'chip':
      if (ds.k === 'week') { U.tab = 'menu'; U.day = 0; U.resetScroll = true; break; }
      var q = { xoi:'Sáng mai ăn xôi với chè được không?', kho:'Thịt kho tàu có được không?', budget:'Bữa tiếp theo còn bao nhiêu calo?', rice:'Món thay cơm trắng' }[ds.k];
      reply(q, ds.k); return;
    case 'chat-use': S.chat[+ds.i].used = true; save(); break;
    case 'rem': S.reminders[ds.k] = !S.reminders[ds.k]; save(); render(); toast(S.reminders[ds.k] ? 'Đã bật nhắc bữa (bản thử chưa gửi thông báo thật)' : 'Đã tắt nhắc bữa'); return;
    case 'theme': S.theme = ds.k; save(); applyTheme(); break;
    case 'reset-ask': U.confirmReset = true; break;
    case 'reset-no': U.confirmReset = false; break;
    case 'reset-yes':
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = { account:null, profile:null, menus:{}, done:{}, reminders:{ sang:true, trua:true, toi:true }, chat:[], theme:'system' };
      U.confirmReset = false; U.view = null; U.tab = 'today'; applyTheme(); break;
  }
  render();
}
app.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  act(el.getAttribute('data-a'), el.dataset);
});
app.addEventListener('submit', function(e){
  e.preventDefault();
  var f = e.target.getAttribute('data-form');
  if (f === 'login') {
    var em = (document.getElementById('lg-email').value || '').trim().toLowerCase(), pw = document.getElementById('lg-pass').value || '';
    U.form = { email:em };
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { U.loginErr = 'Email chưa đúng định dạng, ví dụ ten@vidu.com.'; render(); return; }
    if (pw.length < 6) { U.loginErr = 'Mật khẩu cần ít nhất 6 ký tự.'; render(); document.getElementById('lg-email').value = em; return; }
    if (ONLINE) { emailLogin(em, pw, false); return; }
    U.loginErr = '';
    S.account = { method:'email', label:em, initial:em.charAt(0).toUpperCase() };
    save(); U.resetScroll = true; render();
  } else if (f === 'register') {
    var nm = (document.getElementById('rg-name').value || '').trim();
    var re = (document.getElementById('rg-email').value || '').trim().toLowerCase();
    var p1 = document.getElementById('rg-pass').value || '', p2 = document.getElementById('rg-pass2').value || '';
    U.form = { name:nm, email:re };
    var bad = !nm ? 'Vui lòng nhập họ và tên.'
      : !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(re) ? 'Email chưa đúng định dạng, ví dụ ten@vidu.com.'
      : p1.length < 6 ? 'Mật khẩu cần ít nhất 6 ký tự.'
      : p1 !== p2 ? 'Hai lần nhập mật khẩu chưa khớp.' : '';
    if (bad) { U.loginErr = bad; render(); return; }
    if (ONLINE) { emailLogin(re, p1, true, nm); return; }
    U.loginErr = ''; U.form = null; U.authMode = 'login';
    S.account = { method:'email', name:nm, label:re, initial:nm.charAt(0).toUpperCase() };
    save(); U.resetScroll = true; render(); toast('Đã tạo tài khoản (mô phỏng trong bản thử)');
  } else if (f === 'chat') {
    var inp = document.getElementById('chat-in'), q = (inp.value || '').trim();
    if (!q) return;
    U.chatDraft = '';
    reply(q);
    var ni = document.getElementById('chat-in'); if (ni) ni.focus();
  }
});
app.addEventListener('input', function(e){ if (e.target.id === 'chat-in') U.chatDraft = e.target.value; });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && U.sheet) { U.sheet = null; U.swapView = false; render(); } });

S.chat = (S.chat || []).filter(function(m){ return m.k !== 'typing'; });
applyTheme();
render();
if (ONLINE && S.token) pullProfile();
else if (ONLINE) resumeGoogleRedirect();
})();
</script>
